<div><p style="margin: 0 0 0.875rem; font-size: 0.9375rem; font-weight: 600; color: #295E50">FAQ</p><h2 id="faq-h" style="margin: 0; font-size: clamp(2rem, 3.6vw, 3rem); line-height: 1.05; font-weight: 600; letter-spacing: -0.035em">Fair questions. Straight answers.</h2></div>
<div style="border-top: 1px solid #D5E0DA">
<details style="border-bottom: 1px solid #D5E0DA"><summary style="cursor: pointer; list-style: none; display: flex; justify-content: space-between; gap: 1.5rem; align-items: center; padding: 1.375rem 0; min-height: 44px; font-size: 1.0625rem; font-weight: 600; letter-spacing: -0.015em">How do I know this is genuine?<span style="color: #55665F; display: inline-flex; flex-shrink: 0"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg></span></summary><p style="margin: 0 0 1.5rem; font-size: 1rem; line-height: 1.6; color: #55665F; max-width: 600px">Milaap checks the medical documents of every medical fundraiser before it goes live, and only releases money against hospital bills. Here and on our Milaap page, you can see her real receipts, every doctor who has treated her, and the people who are standing with us. Ask me for her hospital patient ID (UHID) and you can verify it with Kokilaben directly. You’re also welcome to visit us at <a href="https://share.google/fH9ODgBgU0ZenaYG5" style="color: #295E50; font-weight: 600; text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px">Kokilaben Hospital, Andheri West</a> any time. Call or WhatsApp me on +91 91617 46668.</p></details>
<details style="border-bottom: 1px solid #D5E0DA"><summary style="cursor: pointer; list-style: none; display: flex; justify-content: space-between; gap: 1.5rem; align-items: center; padding: 1.375rem 0; min-height: 44px; font-size: 1.0625rem; font-weight: 600; letter-spacing: -0.015em">Where exactly does my money go?<span style="color: #55665F; display: inline-flex; flex-shrink: 0"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg></span></summary><p style="margin: 0 0 1.5rem; font-size: 1rem; line-height: 1.6; color: #55665F; max-width: 600px">Into the Milaap fundraiser for her treatment. Milaap only releases funds for the medical needs stated on the fundraiser, against bills, so it goes to her ICU care now and her surgery and recovery next. Every bill is listed above.</p></details>
<details style="border-bottom: 1px solid #D5E0DA"><summary style="cursor: pointer; list-style: none; display: flex; justify-content: space-between; gap: 1.5rem; align-items: center; padding: 1.375rem 0; min-height: 44px; font-size: 1.0625rem; font-weight: 600; letter-spacing: -0.015em">Does Milaap take a cut?<span style="color: #55665F; display: inline-flex; flex-shrink: 0"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg></span></summary><p style="margin: 0 0 1.5rem; font-size: 1rem; line-height: 1.6; color: #55665F; max-width: 600px">Milaap charges no platform fee. At checkout it may suggest an optional tip to Milaap, which you can change or set to zero. Banks and payment apps charge a small processing fee, roughly 1% to 3.6% depending on how you pay, which is why the amount we receive is slightly less than what was donated.</p></details>
<details style="border-bottom: 1px solid #D5E0DA"><summary style="cursor: pointer; list-style: none; display: flex; justify-content: space-between; gap: 1.5rem; align-items: center; padding: 1.375rem 0; min-height: 44px; font-size: 1.0625rem; font-weight: 600; letter-spacing: -0.015em">Can I donate from outside India?<span style="color: #55665F; display: inline-flex; flex-shrink: 0"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg></span></summary><p style="margin: 0 0 1.5rem; font-size: 1rem; line-height: 1.6; color: #55665F; max-width: 600px">Yes. Milaap accepts international credit and debit cards in several currencies. Foreign-currency donations to medical fundraisers are paid directly to the treating hospital. International cards carry a higher processing fee (about 3.9% plus 30 cents).</p></details>
<details style="border-bottom: 1px solid #D5E0DA"><summary style="cursor: pointer; list-style: none; display: flex; justify-content: space-between; gap: 1.5rem; align-items: center; padding: 1.375rem 0; min-height: 44px; font-size: 1.0625rem; font-weight: 600; letter-spacing: -0.015em">Can I claim a tax deduction?<span style="color: #55665F; display: inline-flex; flex-shrink: 0"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg></span></summary><p style="margin: 0 0 1.5rem; font-size: 1rem; line-height: 1.6; color: #55665F; max-width: 600px">No. This is a personal medical fundraiser, so donations are not eligible for 80G tax benefits. Milaap is not an NGO and only holds the funds for her treatment.</p></details>
<details style="border-bottom: 1px solid #D5E0DA"><summary style="cursor: pointer; list-style: none; display: flex; justify-content: space-between; gap: 1.5rem; align-items: center; padding: 1.375rem 0; min-height: 44px; font-size: 1.0625rem; font-weight: 600; letter-spacing: -0.015em">I can’t give money right now. How else can I help?<span style="color: #55665F; display: inline-flex; flex-shrink: 0"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg></span></summary><p style="margin: 0 0 1.5rem; font-size: 1rem; line-height: 1.6; color: #55665F; max-width: 600px">Donate blood or platelets at <a href="https://share.google/fH9ODgBgU0ZenaYG5" style="color: #295E50; font-weight: 600; text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px">Kokilaben Hospital, Andheri West</a> (7th floor), if you’re in Mumbai, or share this page in one WhatsApp group. Both matter as much as money right now.</p></details>
<details style="border-bottom: 1px solid #D5E0DA"><summary style="cursor: pointer; list-style: none; display: flex; justify-content: space-between; gap: 1.5rem; align-items: center; padding: 1.375rem 0; min-height: 44px; font-size: 1.0625rem; font-weight: 600; letter-spacing: -0.015em">What if the goal isn’t reached?<span style="color: #55665F; display: inline-flex; flex-shrink: 0"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg></span></summary><p style="margin: 0 0 1.5rem; font-size: 1rem; line-height: 1.6; color: #55665F; max-width: 600px">Every rupee still helps. Milaap lets us use whatever is raised for her treatment, even if we don’t reach {{goalLakh}}.</p></details>
<details style="border-bottom: 1px solid #D5E0DA"><summary style="cursor: pointer; list-style: none; display: flex; justify-content: space-between; gap: 1.5rem; align-items: center; padding: 1.375rem 0; min-height: 44px; font-size: 1.0625rem; font-weight: 600; letter-spacing: -0.015em">What if more is raised than she needs?<span style="color: #55665F; display: inline-flex; flex-shrink: 0"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg></span></summary><p style="margin: 0 0 1.5rem; font-size: 1rem; line-height: 1.6; color: #55665F; max-width: 600px">Her treatment is expected to cost about ₹55 lakh, more than our {{goalLakh}} goal, so we don’t expect a surplus. Milaap only allows funds to be used for her medical needs, and if anything is left, we’ll post here exactly how it was used.</p></details>
